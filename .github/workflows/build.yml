name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            dreamina_platform_key: darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set dreamina platform key
        run: echo "DREAMINA_PLATFORM_KEY=${{ matrix.dreamina_platform_key }}" >> "$GITHUB_ENV"

      - name: PyInstaller (mac CLI onefile)
        run: |
          rm -rf dist-cli build-cli
          pyinstaller --noconfirm --clean \
            --distpath dist-cli --workpath build-cli \
            process_storyboard_cli.spec

      - name: Zip mac CLI (for Releases)
        run: |
          RAW_VER="${GITHUB_REF_NAME:-0.0.0}"
          VERSION="${RAW_VER#v}"
          CLI_PATH="dist-cli/process_storyboard"
          ZIP_PATH="dist-cli/process_storyboard-${VERSION}-mac-${{ matrix.arch }}-cli.zip"
          test -f "$CLI_PATH"
          rm -rf dist-cli/package
          mkdir -p dist-cli/package
          cp -f "$CLI_PATH" "dist-cli/package/process_storyboard"
          cp -f "run.command" "dist-cli/package/run.command"
          chmod +x "dist-cli/package/run.command" || true
          ditto -c -k --keepParent "dist-cli/package" "$ZIP_PATH"

      - name: Verify license_sign bundle inputs
        run: test -f scripts/license_common.py && test -f scripts/license_sign.py

      - name: PyInstaller (license_sign, mac)
        run: |
          rm -rf dist-license-sign build-license-sign
          pyinstaller --noconfirm --clean \
            --distpath dist-license-sign --workpath build-license-sign \
            license_sign.spec

      - name: Zip license_sign (mac)
        run: |
          RAW_VER="${GITHUB_REF_NAME:-0.0.0}"
          VERSION="${RAW_VER#v}"
          BIN="dist-license-sign/license_sign"
          ZIP_PATH="dist-license-sign/license_sign-${VERSION}-mac-${{ matrix.arch }}.zip"
          test -f "$BIN"
          rm -f "$ZIP_PATH"
          zip -j "$ZIP_PATH" "$BIN"

      - name: PyInstaller (mac .app)
        run: |
          rm -rf dist-app build-app
          pyinstaller --noconfirm --clean \
            --distpath dist-app --workpath build-app \
            process_storyboard_app.spec

      - name: Create DMG (UDZO)
        run: |
          RAW_VER="${GITHUB_REF_NAME:-0.0.0}"
          VERSION="${RAW_VER#v}"
          APP_PATH="dist-app/process_storyboard.app"
          DMG_PATH="dist-app/process_storyboard-${VERSION}-mac-${{ matrix.arch }}.dmg"
          test -d "$APP_PATH"
          hdiutil create -volname "process_storyboard" -srcfolder "$APP_PATH" -format UDZO -imagekey zlib-level=9 -ov "$DMG_PATH"

      - name: Create PKG (flat)
        run: |
          RAW_VER="${GITHUB_REF_NAME:-0.0.0}"
          VERSION="${RAW_VER#v}"
          IDENTIFIER="com.anxin.process_storyboard.pkg"
          PKG_PATH="dist-app/process_storyboard-${VERSION}-mac-${{ matrix.arch }}.pkg"
          APP_PATH="dist-app/process_storyboard.app"
          test -d "$APP_PATH"
          rm -rf build/pkgroot
          mkdir -p build/pkgroot/Applications
          cp -R "$APP_PATH" "build/pkgroot/Applications/"
          pkgbuild --root build/pkgroot --identifier "$IDENTIFIER" --version "$VERSION" "$PKG_PATH"

      - name: Zip .app (for GitHub Releases)
        run: |
          RAW_VER="${GITHUB_REF_NAME:-0.0.0}"
          VERSION="${RAW_VER#v}"
          APP_PATH="dist-app/process_storyboard.app"
          ZIP_PATH="dist-app/process_storyboard-${VERSION}-mac-${{ matrix.arch }}-app.zip"
          test -d "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload artifacts (mac)
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts-${{ matrix.arch }}
          path: |
            dist-cli/process_storyboard
            dist-cli/process_storyboard-*-mac-${{ matrix.arch }}-cli.zip
            run.command
            dist-app/process_storyboard.app
            dist-app/process_storyboard-*-mac-${{ matrix.arch }}-app.zip
            dist-app/process_storyboard-*-mac-${{ matrix.arch }}.dmg
            dist-app/process_storyboard-*-mac-${{ matrix.arch }}.pkg
            dist-license-sign/license_sign
            dist-license-sign/license_sign-*-mac-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller (.exe)
        shell: pwsh
        run: |
          $env:DREAMINA_PLATFORM_KEY = "windows_amd64"
          pyinstaller --noconfirm --clean process_storyboard_cli.spec

      - name: Zip windows (exe + launcher)
        shell: pwsh
        run: |
          $raw = "${env:GITHUB_REF_NAME}"
          if ([string]::IsNullOrEmpty($raw)) { $raw = "0.0.0" }
          $version = $raw -replace '^v',''
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item -Force dist\process_storyboard.exe dist-win\process_storyboard.exe
          Copy-Item -Force run.bat dist-win\run.bat
          $zipPath = "dist-win\process_storyboard-$version-windows-cli.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path dist-win\process_storyboard.exe,dist-win\run.bat -DestinationPath $zipPath

      - name: Verify license_sign bundle inputs
        shell: pwsh
        run: |
          if (-not (Test-Path "scripts/license_common.py")) { throw "missing scripts/license_common.py" }
          if (-not (Test-Path "scripts/license_sign.py")) { throw "missing scripts/license_sign.py" }

      - name: PyInstaller (license_sign, windows)
        shell: pwsh
        run: |
          if (Test-Path dist-license-sign) { Remove-Item -Recurse -Force dist-license-sign }
          if (Test-Path build-license-sign) { Remove-Item -Recurse -Force build-license-sign }
          pyinstaller --noconfirm --clean --distpath dist-license-sign --workpath build-license-sign license_sign.spec

      - name: Zip license_sign (windows)
        shell: pwsh
        run: |
          $raw = "${env:GITHUB_REF_NAME}"
          if ([string]::IsNullOrEmpty($raw)) { $raw = "0.0.0" }
          $version = $raw -replace '^v',''
          $exe = "dist-license-sign\license_sign.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $zipPath = "dist-license-sign\license_sign-$version-windows.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path $exe -DestinationPath $zipPath

      - name: Upload artifacts (windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/process_storyboard.exe
            dist-win/process_storyboard-*-windows-cli.zip
            run.bat
            dist-license-sign/license_sign.exe
            dist-license-sign/license_sign-*-windows.zip

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download mac artifacts (arm64)
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts-arm64
          path: release-assets/mac/arm64

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets/win

      - name: Show downloaded asset paths
        run: |
          echo "== mac arm64 =="
          ls -laR release-assets/mac/arm64 || true
          echo "== windows =="
          ls -laR release-assets/win || true

      - name: Create GitHub Release (upload installers)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/mac/arm64/dist-cli/process_storyboard-*-mac-arm64-cli.zip
            release-assets/mac/arm64/dist-app/process_storyboard-*-mac-arm64-app.zip
            release-assets/mac/arm64/dist-app/process_storyboard-*-mac-arm64.dmg
            release-assets/mac/arm64/dist-app/process_storyboard-*-mac-arm64.pkg
            release-assets/win/**/process_storyboard-*-windows-cli.zip
            release-assets/win/**/process_storyboard.exe
            release-assets/mac/arm64/dist-license-sign/license_sign-*-mac-arm64.zip
            release-assets/win/**/license_sign-*-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
